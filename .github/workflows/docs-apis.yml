name: docs-apis

on:
  pull_request:
    paths:
      - '.github/workflows/docs-apis.yml'
      - '.redocly.lint-ignore.yaml'
      - 'Makefile'
      - 'api/**'
      - 'eapi.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'redocly.yaml'
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/docs-apis.yml'
      - '.redocly.lint-ignore.yaml'
      - 'Makefile'
      - 'api/**'
      - 'eapi.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'redocly.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate OpenAPI document
        run: make api-docs
      - name: Verify generated document is committed
        run: git diff --exit-code -- api/docs/openapi.json
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v6
        with:
          name: clickvisual-api-docs
          path: |
            api/docs/index.html
            api/docs/openapi.json
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v7
        with:
          name: clickvisual-api-docs
          path: api-docs
      - name: Install obsutil
        run: |
          wget https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -zxvf obsutil_linux_amd64.tar.gz
          obsutil_bin="$(find "$PWD" -maxdepth 2 -type f -name obsutil -print -quit)"
          test -n "$obsutil_bin"
          chmod 755 "$obsutil_bin"
          echo "OBSUTIL_BIN=$obsutil_bin" >> "$GITHUB_ENV"
      - name: Configure obsutil
        run: |
          "$OBSUTIL_BIN" config -i "${{ secrets.OBS_ACCESS_KEY_ID }}" -k "${{ secrets.OBS_ACCESS_KEY_SECRET }}" -e https://obs.cn-north-4.myhuaweicloud.com
      - name: Publish API documentation
        run: |
          "$OBSUTIL_BIN" cp ./api-docs/index.html obs://open-read/clickvisual/api/index.html -f
          "$OBSUTIL_BIN" cp ./api-docs/openapi.json obs://open-read/clickvisual/api/openapi.json -f
